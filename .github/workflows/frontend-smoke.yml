name: frontend smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/frontend-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check required UI structure
        run: |
          grep -q 'two-card-junction-v5' index.html
          grep -q 'id="anchorCard"' index.html
          grep -q 'id="relatedCard"' index.html
          grep -q 'class="junction-pipe"' index.html
          grep -q 'id="connectCard"' index.html
          grep -q 'id="boundaryCard"' index.html
          grep -q 'id="grammarNote"' index.html
          grep -q 'id="expandRelated"' index.html
          grep -q 'function grammarText(a,r)' index.html
          grep -q 'function displayPair()' index.html
          grep -q 'r?.anchorSense' index.html
          grep -q 'rel?.senseNote' index.html
          grep -q 'async function refreshCard(which)' index.html
          grep -q 'No other similar words were found' index.html
          grep -q '.brand-lockup>span{display:block}' index.html
          grep -q 'aria-label="Relationship label"' index.html
          grep -q 'font-size:clamp(42px,8vw,66px)' index.html
          grep -q 'font-size:clamp(38px,9vw,50px)' index.html
          grep -q 'synth.speak(u)' index.html
          ! grep -q 'Make this my word' index.html
          ! grep -q 'id="anotherBtn"' index.html
          ! grep -q 'id="relationDialog"' index.html
          ! grep -q "setTimeout(()=>{synth.resume();synth.speak(u)},0)" index.html
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          start=html.index('<script>')+len('<script>')
          end=html.index('</script>', start)
          Path('/tmp/word-junctions-app.js').write_text(html[start:end])
          PY
          node --check /tmp/word-junctions-app.js
      - name: Check lexical backend
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://word-junction-lexical.phshbone.workers.dev'
          headers={'User-Agent':'Mozilla/5.0 Word-Junctions-Smoke/5.0','Accept':'application/json'}
          for path in ['/health','/lookup?word=motion&mode=similar','/lookup?word=motion&mode=opposite','/lookup?word=careful&mode=similar','/lookup?word=gesture&mode=similar']:
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=json.load(r)
                  assert r.status==200
                  if path!='/health':
                      assert body.get('anchor',{}).get('word')
                      assert isinstance(body.get('alternatives'),list)
          print('frontend smoke passed')
          PY
