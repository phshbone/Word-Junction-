name: repair mobile junction interactions

on:
  push:
    paths:
      - '.github/workflows/ui-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair UI behavior
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = {
            '.brand-lockup span{display:block}.brand-lockup .gold{color:var(--gold)}': '.brand-lockup>span{display:block}.brand-lockup .gold{display:inline;color:var(--gold)}',
            '.relation-badge{position:relative;z-index:2;background:var(--card);border:1px solid rgba(13,63,78,.13);border-radius:18px;padding:9px 15px;color:var(--ink);font-weight:900;font-size:13px;box-shadow:0 6px 18px rgba(14,54,64,.09);pointer-events:none}': '.relation-badge{position:relative;z-index:2;background:rgba(248,244,235,.98);border:0;border-radius:12px;padding:6px 11px;color:var(--ink);font-weight:900;font-size:12px;letter-spacing:.01em;box-shadow:none;pointer-events:none;user-select:none}',
            '<div class="relation-badge" id="relationshipPill">Finding connection…</div>': '<div class="relation-badge" id="relationshipPill" aria-label="Relationship label">Finding connection…</div>',
            '<div class="daily-actions"><button class="link-btn" id="surpriseBtn">Surprise me</button><button class="link-btn" id="chooseBtn">Choose a word</button></div>': '<div class="daily-actions"><button class="link-btn" id="surpriseBtn">Surprise me</button></div>',
            '<div class="build-marker" id="buildMarker">two-card-junction-v1</div>': '<div class="build-marker" id="buildMarker">two-card-junction-v2</div>',
            "function speak(text){if(!text)return;if(!('speechSynthesis'in window)){toast('Speech is not available here.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.86;speechSynthesis.speak(u)}": "function speak(text){if(!text)return;if(!('speechSynthesis'in window)){toast('Speech is not available here.');return}try{const synth=window.speechSynthesis;synth.cancel();synth.resume();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;u.pitch=1;u.volume=1;const voices=synth.getVoices();const voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(voice)u.voice=voice;u.onerror=()=>toast('Pronunciation did not play. Try again.');setTimeout(()=>{synth.resume();synth.speak(u)},0)}catch(e){toast('Pronunciation did not play. Try again.')}}",
            "async function another(){const list=state.data?.alternatives||[];if(list.length<2){toast('That is the only connection in this direction.');return}await animateCard(els.relatedCard,()=>{state.index=(state.index+1)%list.length;render()})}": "async function another(){const list=state.data?.alternatives||[];const r=current();if(!r)return;if(list.length<2){await loadWord(r.word,state.mode,{push:true,label:'Your word'}).catch(()=>{});return}await animateCard(els.relatedCard,()=>{state.index=(state.index+1)%list.length;render()})}\nasync function branchAnchor(){const list=state.data?.alternatives||[];if(!list.length){toast('No connected word is available from this sense.');return}const pool=list.filter((_,i)=>i!==state.index);const pick=(pool.length?pool:list)[Math.floor(Math.random()*(pool.length?pool.length:list.length))];await loadWord(pick.word,state.mode,{push:true,label:'Connected word'}).catch(()=>{})}",
            "$('#newBtn').onclick=openSearch;$('#changeAnchor').onclick=openSearch;$('#chooseBtn').onclick=openSearch;$('#savedBtn').onclick=openSaved;": "$('#newBtn').onclick=openSearch;$('#changeAnchor').onclick=branchAnchor;$('#savedBtn').onclick=openSaved;"
          }

          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing expected source fragment: {old[:90]}')
            s = s.replace(old, new, 1)

          # Keep both card refresh controls usable whenever a related word exists.
          s = s.replace("const multi=(d.alternatives?.length||0)>1;els.anotherBtn.disabled=!multi;$('#changeRelated').disabled=!multi;", "const multi=(d.alternatives?.length||0)>1;els.anotherBtn.disabled=false;$('#changeRelated').disabled=false;", 1)
          s = s.replace("$('#changeRelated').disabled=true;", "$('#changeRelated').disabled=true;", 1)
          s = s.replace("<button class=\"mini-btn\" id=\"changeAnchor\" aria-label=\"Change this word\" title=\"Change this word\">↻</button>", "<button class=\"mini-btn\" id=\"changeAnchor\" aria-label=\"Branch to a connected word\" title=\"Branch to a connected word\">↻</button>", 1)
          s = s.replace("<button class=\"mini-btn\" id=\"changeRelated\" aria-label=\"Another connected word\" title=\"Another connected word\">↻</button>", "<button class=\"mini-btn\" id=\"changeRelated\" aria-label=\"Another connection\" title=\"Another connection\">↻</button>", 1)
          p.write_text(s)

          sw = Path('sw.js')
          w = sw.read_text()
          import re
          w2 = re.sub(r"word-junction[^'\"]*", 'word-junctions-v9', w, count=1)
          if w2 == w:
            print('Service worker cache name unchanged; continuing.')
          else:
            sw.write_text(w2)

      - name: Validate repaired page
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['two-card-junction-v2','branchAnchor','aria-label="Relationship label"','.brand-lockup>span{display:block}']
          for marker in required:
            assert marker in s, marker
          assert "$('#changeAnchor').onclick=openSearch" not in s
          assert 'id="chooseBtn"' not in s
          print('UI repair validation PASS')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Repair junction card interactions and mobile logo"
          git push
