name: lexical backend CI

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/lexical-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OEWN tooling
        run: python -m pip install 'wn>=1.1,<2'
      - name: Run ranking tests
        run: node test/rank.test.mjs
      - name: Build a real OEWN smoke seed
        run: python tools/build_oewn_sql.py --limit 300 --buckets 8192 --out-dir build/smoke
      - name: Validate generated SQL in SQLite
        run: |
          sqlite3 build/smoke.sqlite < schema.sql
          sqlite3 build/smoke.sqlite < build/smoke/oewn-shards.sql
          sqlite3 build/smoke.sqlite "SELECT COUNT(*) AS populated_shards, SUM(entry_count) AS lemmas FROM lexical_shards;"
          test "$(sqlite3 build/smoke.sqlite 'SELECT COUNT(*) FROM lexical_shards;')" -gt 0
          python - <<'PY'
          import json
          m=json.load(open('build/smoke/manifest.json'))
          assert m['senses']==300, m
          assert m['max_payload_bytes'] < 90000, m
          print(m)
          PY
      - name: Verify common lookup words exist in OEWN
        run: |
          python - <<'PY'
          import wn
          net=wn.Wordnet('oewn:2025')
          for word in ('clear','junction','practical','lucid'):
              senses=net.senses(word)
              assert senses, f'missing expected OEWN word: {word}'
              print(word, senses[0].synset().definition())
          PY
