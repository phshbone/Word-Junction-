name: deploy lexical backend

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-lexical-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tooling
        run: |
          python -m pip install 'wn>=1.1,<2'
          npm install --no-save wrangler@latest
      - name: Build complete OEWN shard seed
        run: python tools/build_oewn_sql.py --buckets 8192 --out-dir build/full
      - name: Apply schema to remote D1
        run: npx wrangler d1 execute word_junction --remote --file=schema.sql
      - name: Import complete OEWN seed to remote D1
        run: npx wrangler d1 execute word_junction --remote --file=build/full/oewn-shards.sql
      - name: Verify D1 population
        run: |
          npx wrangler d1 execute word_junction --remote --command="SELECT COUNT(*) AS populated_shards, SUM(entry_count) AS lemmas FROM lexical_shards;"
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Live smoke test
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://word-junction-lexical.phshbone.workers.dev'
          for path in ('/health','/lookup?word=clear&mode=similar','/lookup?word=clear&mode=opposite','/lookup?word=junction&mode=similar'):
              with urllib.request.urlopen(base+path, timeout=30) as r:
                  body=json.load(r)
              print(path, body if path=='/health' else {'query':body.get('query'),'alternatives':len(body.get('alternatives',[]))})
              if path=='/health':
                  assert body.get('ok') is True
              else:
                  assert body.get('query')
                  assert body.get('alternatives')
          PY
