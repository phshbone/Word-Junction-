name: deploy lexical backend

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-lexical-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tooling
        run: |
          python -m pip install 'wn>=1.1,<2'
          npm install --no-save wrangler@latest
      - name: Build complete OEWN shard seed
        run: python tools/build_oewn_sql.py --buckets 8192 --out-dir build/full
      - name: Apply schema to remote D1
        run: npx wrangler d1 execute word_junction --remote --file=schema.sql
      - name: Import complete OEWN seed to remote D1
        run: npx wrangler d1 execute word_junction --remote --file=build/full/oewn-shards.sql
      - name: Verify D1 population
        run: |
          npx wrangler d1 execute word_junction --remote --command="SELECT COUNT(*) AS populated_shards, SUM(entry_count) AS lemmas FROM lexical_shards;"
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Live smoke test
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request

          base='https://word-junction-lexical.phshbone.workers.dev'
          checks=(
              ('/health', 'health'),
              ('/lookup?word=clear&mode=similar', 'lookup'),
              ('/lookup?word=hot&mode=opposite', 'lookup'),
              ('/lookup?word=junction&mode=similar', 'lookup'),
          )

          for path, kind in checks:
              try:
                  with urllib.request.urlopen(base+path, timeout=30) as r:
                      status=r.status
                      body=json.load(r)
              except urllib.error.HTTPError as e:
                  payload=e.read().decode('utf-8', 'replace')
                  raise AssertionError(f'{path} returned HTTP {e.code}: {payload}') from e

              print(path, {'status':status, **(body if kind=='health' else {
                  'query':body.get('query'),
                  'mode':body.get('mode'),
                  'alternatives':len(body.get('alternatives',[])),
                  'error':body.get('error'),
              })})

              assert status == 200, (path, status, body)
              if kind=='health':
                  assert body.get('ok') is True, body
                  assert body.get('shards', 0) > 0, body
                  assert body.get('entries', 0) > 0, body
              else:
                  assert body.get('query'), body
                  assert body.get('alternatives'), body
          PY
