name: live smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/live-smoke.yml'
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages build marker
        run: |
          python - <<'PY'
          import time, urllib.request
          url='https://phshbone.github.io/Word-Junction-/?live-smoke=5'
          for attempt in range(90):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Word-Junctions-Live-Smoke/5.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      html=r.read().decode('utf-8','replace')
                  if 'two-card-junction-v5' in html:
                      print('v5 Pages build is live')
                      raise SystemExit(0)
              except Exception as e:
                  print(f'wait {attempt+1}: {e}')
              time.sleep(5)
          raise SystemExit('Timed out waiting for v5 Pages build')
          PY
      - name: Run live browser smoke
        run: |
          cat > live-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          let deep=null;
          for(let i=0;i<60;i++){
            try{
              deep=await fetch('https://word-junction-lexical.phshbone.workers.dev/lookup?word=motion&mode=similar',{headers:{'cache-control':'no-cache'}}).then(r=>r.json());
              if(deep?.quality?.multiSensePool) break;
            }catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          assert.equal(deep?.quality?.multiSensePool,true,'deep lexical backend not live');
          assert.equal(deep?.quality?.samePartOfSpeechOnly,true);
          assert(deep?.alternatives?.length>0);
          assert(deep.alternatives.every(x=>x.anchorSense?.senseId));

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const consoleErrors=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('pageerror',e=>consoleErrors.push(String(e)));
          const text=sel=>page.locator(sel).textContent().then(x=>x.trim());
          try{
            await page.goto('https://phshbone.github.io/Word-Junction-/?live-smoke=5',{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#buildMarker',{state:'attached'});
            assert.equal(await text('#buildMarker'),'two-card-junction-v5');
            assert.equal(await page.locator('#relationshipPill').evaluate(el=>getComputedStyle(el).pointerEvents),'none');
            assert(await page.locator('#connectCard').isVisible());
            assert(await page.locator('#boundaryCard').isVisible());
            assert(await page.locator('#expandRelated').isVisible());
            assert((await page.locator('.brand-lockup').boundingBox()).width>100);

            await page.locator('#newBtn').click();
            await page.locator('#wordSearch').fill('motion');
            await page.locator('#searchForm button[type="submit"]').click();
            await page.waitForFunction(()=>document.querySelector('#anchorWord')?.textContent?.trim()==='motion',{timeout:30000});
            const originalTop=await text('#anchorWord');
            const originalBottom=await text('#relatedWord');
            assert(originalBottom && originalBottom!=='—');
            assert((await text('#connectText')).length>0);
            assert((await text('#boundaryText')).length>0);

            assert.equal(await page.locator('#expandRelated').getAttribute('aria-expanded'),'false');
            await page.locator('#expandRelated').click();
            assert.equal(await page.locator('#expandRelated').getAttribute('aria-expanded'),'true');
            assert(await page.locator('#saveBtn').isVisible());
            await page.locator('#expandRelated').click();
            assert.equal(await page.locator('#expandRelated').getAttribute('aria-expanded'),'false');

            await page.locator('#changeRelated').click();
            await page.waitForTimeout(1500);
            assert.equal(await text('#anchorWord'),originalTop);
            assert(!(await page.locator('#wordDialog').isVisible()));

            await page.locator('#newBtn').click();
            await page.locator('#wordSearch').fill('motion');
            await page.locator('#searchForm button[type="submit"]').click();
            await page.waitForFunction(()=>document.querySelector('#anchorWord')?.textContent?.trim()==='motion',{timeout:30000});
            const fixedBottom=await text('#relatedWord');
            await page.locator('#changeAnchor').click();
            await page.waitForTimeout(1500);
            assert.equal(await text('#relatedWord'),fixedBottom);
            assert(!(await page.locator('#wordDialog').isVisible()));

            await page.locator('#newBtn').click();
            await page.locator('#wordSearch').fill('motion');
            await page.locator('#searchForm button[type="submit"]').click();
            await page.waitForFunction(()=>document.querySelector('#anchorWord')?.textContent?.trim()==='motion',{timeout:30000});
            await page.locator('#oppositeTab').click();
            await page.waitForFunction(()=>document.querySelector('#oppositeTab')?.classList.contains('active'),{timeout:30000});
            const oppositeRelated=await text('#relatedWord');
            assert(oppositeRelated && oppositeRelated!=='—');
            assert((await page.locator('#junction').getAttribute('class')).includes('opposite'));

            await page.locator('#expandRelated').click();
            await page.locator('#saveBtn').click();
            assert((await text('#saveBtn')).includes('Saved'));
            await page.locator('#exampleBtn').click();
            assert(await page.locator('#exampleDialog').isVisible());
            await page.locator('[data-close="exampleDialog"]').click();

            await page.screenshot({path:'/tmp/word-junctions-live-smoke.png',fullPage:true});
            if(consoleErrors.length) throw new Error('Console errors: '+consoleErrors.join(' | '));
            console.log(JSON.stringify({status:'PASS',motionCandidates:deep.alternatives.length,motionPos:deep.pool?.partOfSpeech,originalTop,originalBottom,oppositeRelated}));
          }catch(e){
            await page.screenshot({path:'/tmp/word-junctions-live-smoke-failure.png',fullPage:true}).catch(()=>{});
            console.error(e);
            process.exitCode=1;
          }finally{await browser.close()}
          EOF
          node live-smoke.mjs
      - name: Upload live smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-junctions-live-smoke-screenshots
          path: /tmp/word-junctions-live-smoke*.png
          if-no-files-found: ignore
